name: careerly
description: "Careerly — a personal career workspace."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  local_auth: ^3.0.2
  pdf: ^3.13.1
  pdfrx: ^2.6.5
  printing: ^5.15.1
  receive_sharing_intent: 1.9.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icons/careerly_logo.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700

# App icon: `dart run flutter_launcher_icons`. The adaptive layers in
# assets/branding are cut from the logo so launchers can mask them cleanly.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/careerly_logo.png
  min_sdk_android: 24
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png

# Launch screen: `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#F5F6F7"
  color_dark: "#111315"
  image: assets/icons/careerly_logo.png
  android_12:
    image: assets/branding/splash_icon.png
    icon_background_color: "#202326"
    color: "#F5F6F7"
    image_dark: assets/branding/splash_icon.png
    icon_background_color_dark: "#202326"
    color_dark: "#111315"
  web: false
